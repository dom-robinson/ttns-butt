name: Build TTNS Deck

on:
  push:
    branches: [master, ttns-mixer]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            arch_label: arm64
          - runs-on: macos-15-intel
            arch_label: x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install fltk portaudio lame libvorbis libogg flac opus libsamplerate fdk-aac pkg-config autoconf automake libtool curl
      - name: Build
        run: |
          # Prefer Homebrew curl (WebSocket API for WAN dial-in)
          if [ -d /opt/homebrew/opt/curl ]; then
            export PATH="/opt/homebrew/opt/curl/bin:$PATH"
            export PKG_CONFIG_PATH="/opt/homebrew/opt/curl/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          elif [ -d /usr/local/opt/curl ]; then
            export PATH="/usr/local/opt/curl/bin:$PATH"
            export PKG_CONFIG_PATH="/usr/local/opt/curl/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi
          autoreconf -fi
          ./configure
          make -C src -j3
      - name: Package
        run: |
          chmod +x scripts/*.sh
          ./scripts/generate-icons.sh
          ./scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ttns-deck-macos-${{ matrix.arch_label }}
          path: dist/macos/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            libfltk1.3-dev libportaudio2 portaudio19-dev libmp3lame-dev \
            libvorbis-dev libogg-dev libflac-dev libopus-dev libsamplerate0-dev \
            libfdk-aac-dev libcurl4-openssl-dev python3-pillow
      - name: Build
        run: |
          autoreconf -fi
          ./configure
          make -C src -j2
      - name: Package
        run: |
          chmod +x scripts/*.sh
          bash scripts/generate-icons.sh || true
          ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ttns-deck-linux-x64
          path: dist/linux/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install MSYS2 build dependencies
        run: bash scripts/ci-install-msys2-deps.sh
      - name: Generate icon
        run: |
          chmod +x scripts/*.sh
          bash scripts/generate-icons.sh || true
      - name: Build
        run: |
          autoreconf -fi
          ./configure --disable-dependency-tracking
          mingw32-make -C src -j2
      - name: Package
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ttns-deck-windows-x64
          path: dist/windows/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Stage release packages
        run: |
          chmod +x scripts/stage-release-packages.sh
          ./scripts/stage-release-packages.sh release-packages release-artifacts
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## TTNS Deck preliminary release

            DJ testing build. See [docs/TTNS_DJ_GUIDE.md](docs/TTNS_DJ_GUIDE.md) and [docs/RELEASE.md](docs/RELEASE.md).

            Binary packages include `legal/` with GPL and third-party license texts ([docs/LICENSING.md](docs/LICENSING.md)).

            | Platform | File |
            |----------|------|
            | macOS Apple Silicon | `ttns-deck-arm64-macos.zip` |
            | macOS Intel | `ttns-deck-x86_64-macos.zip` |
            | Linux x64 | `ttns-deck-linux-x86_64.tar.gz` |
            | Windows x64 | `ttns-deck-win64.zip` |

            **Unsigned macOS:** right-click app → Open the first time.

            Config contains Icecast passwords — distribute only to TTNS DJs.
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
