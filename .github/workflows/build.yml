name: Build TTNS Deck

on:
  push:
    branches: [master, ttns-mixer, feature/remote-dial-in]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            arch_label: arm64
          - runs-on: macos-15-intel
            arch_label: x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install fltk portaudio lame libvorbis libogg flac opus libsamplerate fdk-aac pkg-config autoconf automake libtool curl
      - name: Build
        run: |
          # Prefer Homebrew curl (WebSocket API for WAN dial-in)
          if [ -d /opt/homebrew/opt/curl ]; then
            export PATH="/opt/homebrew/opt/curl/bin:$PATH"
            export PKG_CONFIG_PATH="/opt/homebrew/opt/curl/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          elif [ -d /usr/local/opt/curl ]; then
            export PATH="/usr/local/opt/curl/bin:$PATH"
            export PKG_CONFIG_PATH="/usr/local/opt/curl/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi
          autoreconf -fi
          ./configure
          make -C src -j3
      - name: Package
        run: |
          chmod +x scripts/*.sh
          ./scripts/generate-icons.sh
          ./scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ttns-deck-macos-${{ matrix.arch_label }}
          path: dist/macos/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            libfltk1.3-dev libportaudio2 portaudio19-dev libmp3lame-dev \
            libvorbis-dev libogg-dev libflac-dev libopus-dev libsamplerate0-dev \
            libfdk-aac-dev libcurl4-openssl-dev python3-pillow
      - name: Build
        run: |
          autoreconf -fi
          ./configure
          make -C src -j2
      - name: Package
        run: |
          chmod +x scripts/*.sh
          bash scripts/generate-icons.sh || true
          ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ttns-deck-linux-x64
          path: dist/linux/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install MSYS2 build dependencies
        run: bash scripts/ci-install-msys2-deps.sh
      - name: Generate icon
        run: |
          chmod +x scripts/*.sh
          bash scripts/generate-icons.sh || true
      - name: Build
        run: |
          autoreconf -fi
          ./configure --disable-dependency-tracking
          mingw32-make -C src -j2
      - name: Package
        run: bash scripts/build-windows.sh
      - name: Windows setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Get-Content packaging/VERSION -Raw).Trim()
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc "/DMyAppVersion=$ver" "packaging\windows\ttns-deck.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          $out = "dist\windows\TTNS-Deck-$ver-windows-x64-setup.exe"
          if (-not (Test-Path $out)) { throw "Missing installer $out" }
      - uses: actions/upload-artifact@v4
        with:
          name: ttns-deck-windows-x64
          path: dist/windows/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Stage release packages
        run: |
          chmod +x scripts/stage-release-packages.sh
          ./scripts/stage-release-packages.sh release-packages release-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          body: |
            ## TTNS Deck ${{ github.ref_name }}

            Crew / DJ build. **Prefer the .dmg (Mac) or setup.exe (Windows)** — double-click, no unzip gymnastics.

            **This build:** Settings → Audio → **Refresh devices** after plugging in an interface. **PTT** on the Remotes bar talks to guests off-air without ducking the music bed.

            | Platform | Download |
            |----------|----------|
            | macOS Apple Silicon | `TTNS-Deck-*-macos-arm64.dmg` — open, drag **TTNS Deck** to Applications |
            | macOS Intel | `TTNS-Deck-*-macos-x64.dmg` |
            | macOS 12 Monterey (Apple Silicon) | `TTNS-Deck-*-macos-arm64-monterey12.dmg` if attached |
            | Windows 10+ | `TTNS-Deck-*-windows-x64-setup.exe` |
            | Linux x64 | `ttns-deck-linux-x86_64.tar.gz` |

            Portable zips (`ttns-deck-*-macos.zip`, `ttns-deck-win64.zip`) are also attached.

            **macOS:** if “Apple could not verify…” click **Done**, then Privacy & Security → **Open Anyway**. Send the **.dmg file**, never the `.app` folder (Dropbox turns it into a `Contents` folder).

            **Windows:** if SmartScreen appears: More info → Run anyway.

            See [docs/USER_GUIDE.md](docs/USER_GUIDE.md) and [docs/RELEASE.md](docs/RELEASE.md).

            Packages include `legal/` (GPL + third-party notices). Icecast passwords may be in presets — distribute only to TTNS DJs.
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
